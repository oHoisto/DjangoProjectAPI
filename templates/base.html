{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}The Moon{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    {% block extra_css %}{% endblock %}
</head>

<body data-bs-theme="dark">
    <div class="d-flex justify-content-center min-vh-100 p-3">
        <div class="app-shell">

            <nav class="d-flex justify-content-center gap-3 mb-4">
                <a href="/" class="btn btn-primary">Главная</a>
                <a href="/add/" class="btn btn-success">Добавить новость</a>
            </nav>

            {% block content %}
            {% endblock %}

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
