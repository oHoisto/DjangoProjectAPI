{% extends "base.html" %}

{% block title %}Удалить аккаунт{% endblock %}

{% block extra_css %}
<style>
    * {
        transition: none !important;
        animation: none !important;
    }

    .news-card,
    .news-card:hover {
        transform: none !important;
        box-shadow: none !important;
    }
</style>
{% endblock %}

{% block content %}
    <div class="news-card text-center mx-auto" style="max-width: 700px;">
        <h1 class="mb-4">Удалить аккаунт?</h1>

        <p>
            Вы действительно хотите удалить аккаунт?
            Все ваши новости тоже будут удалены.
        </p>

        <form method="post">
            {% csrf_token %}

            <button type="submit" class="btn btn-danger">
                Да, удалить аккаунт
            </button>

            <a href="{% url 'profile' %}" class="btn btn-secondary">
                Отмена
            </a>
        </form>
    </div>
{% endblock %}
